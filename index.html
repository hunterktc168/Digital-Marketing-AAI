<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AAI Global Kit Generator</title>
    <meta name="description" content="Developer tool for scaling localized marketing assets using Gemini 3.1 Flash Image." />
    <meta property="og:title" content="AAI Global Kit Generator" />
    <meta property="og:description" content="Developer tool for scaling localized marketing assets using Gemini 3.1 Flash Image." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('aai-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-[var(--accent-soft)] selection:text-[var(--text-primary)]">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
